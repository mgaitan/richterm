name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/cd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  UV_MALWARE_CHECK: "1"

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv build

      - name: Smoke test built wheel in isolation
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          test -n "$wheel"
          uv run --isolated --no-project --with "$wheel" python -c "import richterm"

      - name: Generate PEP 740 publish attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - run: uv publish

  docs-publish:
    name: Publish documentation to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name != 'release' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-preview' || 'github-pages' }}
      url: ${{ steps.preview_url.outputs.url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Detect documentation preview target
        id: preview
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "docs_subdir=_preview/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6.0.0
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build documentation for current ref
        env:
          FORCE_COLOR: 1
          COLUMNS: 90
          UV_COLOR: always
          PYTHONPATH: src
        run: |
          unset NO_COLOR
          make docs
          mv docs/_build/html docs/_build/html-current
      - name: Build stable documentation from main
        if: github.event_name == 'pull_request'
        env:
          FORCE_COLOR: 1
          COLUMNS: 90
          UV_COLOR: always
        run: |
          git fetch origin main --depth=1
          git worktree add ../richterm-main origin/main
          cd ../richterm-main
          unset NO_COLOR
          PYTHONPATH=src make docs
      - name: Stage documentation artifact
        run: |
          out_dir="site"
          subdir="${{ steps.preview.outputs.docs_subdir }}"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          if [ -n "$subdir" ]; then
            cp -a ../richterm-main/docs/_build/html/. "$out_dir/"
            mkdir -p "$out_dir/$subdir"
            cp -a docs/_build/html-current/. "$out_dir/$subdir/"
          else
            cp -a docs/_build/html-current/. "$out_dir/"
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Compute documentation URL
        id: preview_url
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          subdir="${{ steps.preview.outputs.docs_subdir }}"
          if [ -n "$subdir" ]; then
            url="${url%/}/${subdir}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Summarize documentation URL
        run: |
          echo "Documentation published at: ${{ steps.preview_url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
